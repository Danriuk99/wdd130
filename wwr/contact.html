<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <meta name="description" content="Contact White Water Rafting for general inquiries, trip reservations, or website feedback.">
    <meta name="author" content="David Martinez">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="Rafting Company Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main class="contact-main">
        <h1>Contact Us</h1>

        <section class="company-info">
            <div class="info-details">
                <h2>Our Office</h2>
                <p>📍 123 Main Street, Salmon, ID 83467</p>
                <p>📞 (208) 555-1234</p>
                <p>✉️ info@whitewaterrafting.com</p>
            </div>
            <div class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d11516.488390977218!2d-113.8967912!3d45.176019!2m3!1f0!0f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x53a067e7c8b2bd31%3A0xd6e54f9a5f782f9c!2sSalmon%2C%20ID%2083467!5e0!3m2!1sen!2sus!4v1700000000000!5m2!1sen!2sus" width="600" height="250" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </section>

        <section class="employees">
            <h2>Meet Our Team</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/worker_1.png" alt="John Martinez - Lead Guide">
                    <figcaption><strong>John Martinez</strong><br>Lead River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/worker_2.png" alt="Sara Smith - Safety Director">
                    <figcaption><strong>Sara Smith</strong><br>Safety Director</figcaption>
                </figure>
                <figure>
                    <img src="images/worker_3.png" alt="Robert Smith - Office Manager">
                    <figcaption><strong>Robert Smith</strong><br>Office Manager</figcaption>
                </figure>
            </div>
        </section>

        <section class="contact-form-section">
            <h2>Send Us a Message</h2>
            <form action="#" method="post" class="contact-form">
                <div class="form-item">
                    <label for="username">Your Name:</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-item">
                    <label for="useremail">Your Email:</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>

                <fieldset class="radio-group">
                    <legend>Purpose of Message:</legend>
                    <label>
                        <input type="radio" id="general" name="purpose" value="general" checked> General Inquiry
                    </label>
                    <label>
                        <input type="radio" id="reservation" name="purpose" value="reservation"> Reservation Question
                    </label>
                    <label>
                        <input type="radio" id="suggestion" name="purpose" value="suggestion"> Website Suggestion
                    </label>
                </fieldset>

                <div class="form-item">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <div class="form-item checkbox-item">
                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter" value="subscribe"> Please subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>©️ 2026 | White Water Rafting | David Martinez</p>
        <nav class="socialmedia">
            <a href="https://facebook.svg" target="_blank">
                <img src="images/facebook.svg" alt="Fabecook Icon">
            </a>
            <a href="https://www.instagram.com/" target="_blank">
                <img src="images/instagram.svg" alt="Instagram Iconn">  
            </a>
            <a href="https://www.pinterest.com/" target="_blank">
                <img src="images/pinterest.svg" alt="Pinterest Icon">

            </a>
        </nav>
    </footer>

</body>
</html>
